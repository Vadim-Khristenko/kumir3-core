# Правила проверки зависимостей (cargo-deny).
#
# Проверяются три вещи: известные уязвимости, дубликаты и происхождение крейтов.
# Проверка лицензий пока не включена — её стоит добавлять отдельным изменением,
# вместе с осознанным списком разрешённых лицензий.

[advisories]
# Уязвимость в зависимости — отказ сборки. Неподдерживаемый крейт — предупреждение:
# это повод завести задачу, а не ронять ветку.
yanked = "deny"
unmaintained = "workspace"

[bans]
# Несколько версий одного крейта в графе — предупреждение: раздувает сборку,
# но обычно приходит из чужих зависимостей и чинится не сразу.
multiple-versions = "warn"
wildcards = "deny"
# Крейты внутри этого репозитория подключаются по пути и версии не требуют —
# запрет касается зависимостей извне.
allow-wildcard-paths = true

[sources]
# Крейты берутся только из crates.io. Git-зависимость обязана быть осознанной:
# чтобы её добавить, нужно изменить этот файл.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

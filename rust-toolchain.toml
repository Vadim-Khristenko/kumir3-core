# Единая версия Rust для всех: локальной сборки, CI и релизов.
#
# Пока версия задавалась как «stable», у разработчика и у CI оказывались разные
# компиляторы: локально всё зелено, а сборка падает на правилах clippy, которых
# в старом наборе ещё не было. Здесь версия одна, и rustup поставит именно её.
#
# Как обновлять: поднять `channel`, прогнать `cargo fmt`, `cargo clippy` и
# `cargo test`, починить новые замечания и закоммитить одним изменением.
# Еженедельная задача `toolchain-drift` в CI заранее показывает, что сломается.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"

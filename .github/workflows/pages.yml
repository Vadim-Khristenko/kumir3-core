name: KITE Pages

# Публикация стандарта KITE как сайта.
#
# Документы в `arch/kite/` — встраиваемые HTML-фрагменты без `<head>`; сайт
# собирает из них полноценные страницы (см. tools/kite-site.ts), не меняя
# исходники. На pull request сборка только проверяется, публикует лишь `dev`.

on:
  push:
    branches: [dev]
    paths:
      - 'arch/kite/**'
      - 'tools/kite-site.ts'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'arch/kite/**'
      - 'tools/kite-site.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # Адрес сайта берётся у самого GitHub Pages: он знает про настроенный
      # домен, а угадывание вида «владелец.github.io» его бы не учло.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Собрать сайт
        run: bun tools/kite-site.ts --out _site --base "${{ steps.pages.outputs.base_url }}"

      - name: Проверить, что ни одна страница не осталась фрагментом
        run: |
          missing=0
          for f in _site/*.html; do
            head -c 15 "$f" | grep -qi '<!DOCTYPE html>' || { echo "::error file=$f::страница без DOCTYPE"; missing=1; }
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Публикация
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

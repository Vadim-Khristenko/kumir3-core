name: Build & Release

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      force_clean:
        description: 'Force clean build (skip cache)'
        required: false
        default: false
        type: boolean
      rebuild_only:
        description: 'Only rebuild (skip tests)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── Стиль и линтеры (быстрый отказ) ─────────────────────────
  lint:
    name: Стиль и линтеры
    if: ${{ !inputs.rebuild_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Ставит тулчейн из rust-toolchain.toml, сам подключает rust-cache,
      # даёт GitHub-аннотации ошибок cargo/clippy/rustfmt прямо в диффе PR.
      - name: Установить Rust (с problem matchers)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache-key: lint

      - name: cargo fmt --check
        run: |
          echo "::group::cargo fmt --check"
          cargo fmt --all -- --check
          echo "::endgroup::"

      - name: cargo clippy
        run: |
          echo "::group::cargo clippy"
          cargo clippy --workspace --all-targets --locked -- -D warnings
          echo "::endgroup::"

  # ───────────────────────────── Тесты на трёх системах ─────────────────────────────
  test:
    name: Тесты (${{ matrix.os }})
    if: ${{ !inputs.rebuild_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # sccache включается только там, где он поставлен: RUSTC_WRAPPER на уровне
    # workflow достался бы и линтерам с аудитом, где sccache нет, — и cargo
    # упал бы, не найдя обёртку.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установить Rust (с problem matchers)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: test-${{ matrix.os }}

      # sccache-кэш для компилятора (доп. к rust-cache); можно убрать если не нужен.
      - uses: mozilla-actions/sccache-action@v0.0.10

      # NASM ставим нативно, без Node-экшенов — быстрее и без варнингов о legacy Node20.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      # Быстрый прогон бинарных тестов + отдельно доктесты (nextest их не поддерживает).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run
        run: |
          echo "::group::cargo nextest run"
          cargo nextest run --workspace --locked
          echo "::endgroup::"

      - name: cargo test --doc
        run: |
          echo "::group::cargo test --doc"
          cargo test --doc --workspace --locked
          echo "::endgroup::"

  # ──────────────────────── Аудит зависимостей ────────────────────────
  audit:
    name: Аудит зависимостей
    if: ${{ !inputs.rebuild_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  # ─────────────────────── Сборка бинарников ───────────────────────
  build:
    name: Сборка (${{ matrix.os }})
    needs: [lint, test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: kumir3-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: kumir3-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: kumir3-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установить Rust (с problem matchers)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: build-${{ matrix.os }}
        if: ${{ !inputs.force_clean }}

      - name: Установить Rust (без кэша, force_clean)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
        if: ${{ inputs.force_clean }}

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      # Для обычных прогонов — thin LTO (быстрее линковка).
      # Для релизного тега — fat LTO + strip, ценой более долгой сборки, но лучшего рантайма.
      - name: Build release
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'fat' || 'thin' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(github.ref, 'refs/tags/v') && 'symbols' || 'none' }}
        run: |
          echo "::group::cargo build --release"
          cargo build --release --workspace --locked --target ${{ matrix.target }}
          echo "::endgroup::"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/interpreter-cli" dist/
          cp "target/${{ matrix.target }}/release/interpreter-tui" dist/
          cp "target/${{ matrix.target }}/release/kumir3-compiler" dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ 2>/dev/null || true
          tar -czf "${{ matrix.archive }}" -C dist .
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/interpreter-cli.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/interpreter-tui.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/kumir3-compiler.exe" dist/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  # ───────────────── Релиз (по тегу vX.Y.Z) ─────────────────
  release:
    name: Релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/*.tar.gz,artifacts/*.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Тег с суффиксом (v1.2.3-alpha.4) — предварительный выпуск: он не
          # становится «последним релизом» и не подсовывается тем, кому нужен
          # стабильный.
          prerelease: ${{ contains(github.ref_name, '-') }}

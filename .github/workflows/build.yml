name: Build & Release

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      force_clean:
        description: 'Force clean build (skip cache)'
        required: false
        default: false
        type: boolean
      rebuild_only:
        description: 'Only rebuild (skip tests)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: true

# Наименьшие права по умолчанию; job, которому нужно больше, просит явно.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────── Стиль и линтеры (быстрый отказ) ─────────────────────────
  lint:
    name: Стиль и линтеры
    if: ${{ !inputs.rebuild_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Версия берётся из rust-toolchain.toml — она же и у разработчика.
      - name: Установить закреплённый Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ───────────────────────────── Тесты на трёх системах ─────────────────────────────
  test:
    name: Тесты (${{ matrix.os }})
    if: ${{ !inputs.rebuild_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Установить закреплённый Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: cargo test
        run: cargo test --workspace --locked

  # ──────────────────────── Аудит зависимостей ────────────────────────
  audit:
    name: Аудит зависимостей
    if: ${{ !inputs.rebuild_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  # ─────────────────────── Сборка бинарников ───────────────────────
  build:
    name: Сборка (${{ matrix.os }})
    needs: [lint, test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: kumir3-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: kumir3-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: kumir3-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Установить закреплённый Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}
        if: ${{ !inputs.force_clean }}

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build release
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/interpreter-cli" dist/
          cp "target/${{ matrix.target }}/release/interpreter-tui" dist/
          cp "target/${{ matrix.target }}/release/kumir3-compiler" dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ 2>/dev/null || true
          tar -czf "${{ matrix.archive }}" -C dist .
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/interpreter-cli.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/interpreter-tui.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/kumir3-compiler.exe" dist/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  # ───────────────── Релиз (по тегу vX.Y.Z) ─────────────────
  release:
    name: Релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Подпись происхождения: подтверждает, что архивы собрал именно этот workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/*.tar.gz,artifacts/*.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
